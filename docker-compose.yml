# OPTIONAL: Milvus Standalone + Attu UI.
# The PoC runs on Milvus Lite (a local file) by default. Attu cannot open a Milvus Lite
# file, so use this when the team wants a Milvus server / Attu:
#   docker compose up -d
#   set MILVUS_DB_URI=http://localhost:19530 in .env
#   open http://localhost:8000  (Attu)
# Port already in use? e.g. MILVUS_HOST_PORT=19531 ATTU_PORT=8001 POSTGRES_HOST_PORT=5433 docker compose up -d
#   (then MILVUS_DB_URI=http://localhost:19531, POSTGRES_URI=...@localhost:5433/...)
# Only Postgres (checkpointer) while keeping Milvus Lite: docker compose up -d postgres
#
# Note: MinIO removed its images from Docker Hub, so minio is pulled from quay.io.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # MinIO console (optional)
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    # No healthcheck: the MinIO image has no curl; Milvus retries until MinIO is up.

  milvus-standalone:
    image: milvusdb/milvus:v2.6.17
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_HOST_PORT:-19530}:19530"
      # 9091 (health/metrics) stays inside Docker; the healthcheck uses it from within the container.
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    # Checkpointer storage (CHECKPOINTER=postgres). Start alone with: docker compose up -d postgres
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_checkpoints
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 20

  attu:
    image: zilliz/attu:latest
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "${ATTU_PORT:-8000}:3000"
    depends_on:
      milvus-standalone:
        condition: service_healthy
